[tool.poetry]
name = "jstdata"
version = "0.2.0"
description = "Python API, CLI, and interactive workflows for Jefferson Street financial and economic data."
authors = ["Mahfuj Ahbab"]
readme = "README.md"
license = "MIT"
include = ["jstdata/workflows/bundled/*.yaml"]
homepage = "https://github.com/Jefferson-Street-Technologies/jstdata"
repository = "https://github.com/Jefferson-Street-Technologies/jstdata"
keywords = ["api", "cli", "data", "jefferson street", "economics", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.2.1"
pandas = "^2.3.1"
tabulate = "^0.9.0"
textual = "^1.0.0"
pyperclip = "^1.9.0"
pyyaml = "^6.0.3"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
requests-mock = "^1.12.1"
pytest-cov = "^6.1.1"
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.2.0"
mypy = "^1.15.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
jst = "jstdata.cli:cli"
