phases:
  - text: |
      HELLO, WORLD — your first investigation.
      You'll compare Apple, Microsoft, and Amazon.
    until:
      auto: true

  - text: |
      Search for "Apple" and press Enter to add it.
    step_index: 0
    until:
      session_entity_count: 1

  - text: |
      Add Microsoft and Amazon the same way.
    step_index: 0
    until:
      session_entity_count: 3

  - text: |
      Continue to metric discovery. Press n.
    step_index: 0
    until:
      action: next_step

  - text: |
      Pick a metric for these companies. Press Space to add it to your session.
    step_index: 1
    until:
      session_metric_count: 1

  - text: |
      Open your session. Press s.
    until:
      action: open_session

  - text: |
      Export your session. Press e, then click Write.
    until:
      action: session_written

  - text: |
      Tutorial complete. This is your session — keep exploring.
    until:
      done: true
